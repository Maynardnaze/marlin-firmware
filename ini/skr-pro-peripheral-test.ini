# Optional external EEPROM test. Not the default environment.
# Requires a standard 16-bit-addressed 24C32/24C64/24C128/24C256/24C512
# at I2C 7-bit address 0x50, write protect low, using the first 4 KiB.
# Not for 24C01/02/04/08/16 or an unidentified EEPROM.
[env:BTT_SKR_PRO_I2C_24C32_PLUS]
extends = env:BTT_SKR_PRO
build_flags = ${env:BTT_SKR_PRO.build_flags} -DSKR_PRO_EXTERNAL_I2C_EEPROM
